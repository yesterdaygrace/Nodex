name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: host=127.0.0.1 user=postgres password=postgres dbname=test_db port=5432 sslmode=disable
    defaults:
      run:
        working-directory: Nodex
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files not formatted:"
            gofmt -l .
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v -count=1
      - name: Build binary
        run: go build -o /tmp/server .
      - name: Docker build smoke (Nodex context)
        run: docker build -t nodex:ci .
